services:
  - type: web
    name: backend-2
    runtime: python
    repo: https://github.com/pg460482-cell/backend
    branch: main
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn run:app --workers 2 --timeout 120
    plan: free
    pythonVersion: "3.11"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: backend-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: backend-db
    plan: free
    databaseName: backend_db
    user: backend_user
